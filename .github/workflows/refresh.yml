name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # a shallow clone cannot rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        id: update
        run: python scripts/update_playlist.py

      - name: Commit and push if playlist changed
        id: commit
        if: success() && steps.update.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f playlist.m3u8 ]; then
            echo "playlist.m3u8 not found — skipping commit."
            exit 0
          fi

          git add playlist.m3u8 playlist-all.m3u8

          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "chore: refresh playlist [skip ci]"

            # The build takes minutes, so a commit can land while it runs. A
            # bare push then loses the whole playlist to a non-fast-forward,
            # which is exactly how the geo-restriction fix got thrown away.
            for attempt in 1 2 3; do
              if git push; then
                echo "Pushed on attempt $attempt."
                exit 0
              fi
              echo "Push rejected — rebasing onto origin/main and retrying."
              git pull --rebase --autostash origin main
            done

            echo "Could not push after 3 attempts." >&2
            exit 1
          fi

      - name: Upload playlist as artifact
        if: success() && steps.update.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playlist
          path: |
            playlist.m3u8
            playlist-all.m3u8
          retention-days: 7
          if-no-files-found: warn

      - name: Report status
        if: always()
        run: |
          echo "Update status: ${{ steps.update.outcome || 'unknown' }}"
          echo "Commit status: ${{ steps.commit.outcome || 'skipped' }}"
