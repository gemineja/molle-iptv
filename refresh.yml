name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        run: python scripts/update_playlist.py

      - name: Commit and push if playlist changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f playlist.m3u8 ]; then
            echo "playlist.m3u8 not found — skipping commit."
            exit 0
          fi

          git add playlist.m3u8

          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "chore: refresh playlist [skip ci]"
            git push
          fi

      - name: Upload playlist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlist
          path: playlist.m3u8
          retention-days: 7
          if-no-files-found: warn

      - name: Report status
        if: always()
        run: |
          echo "Update status: ${{ steps.update.outcome || 'completed' }}"